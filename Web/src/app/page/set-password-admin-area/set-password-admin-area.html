<form class="auth-page" (ngSubmit)="submit()" [formGroup]="form">
  <div class="auth-language">
    <app-drop-down
      formControlName="language"
      [options]="languageOptions"
      icon="language"
      [placeholder]="t.languagePlaceholder"
      size="md"
      [showDescription]="false"
    />
  </div>

  <app-card
    class="auth-card"
    [title]="t.title"
    [subtitle]="t.subtitle"
    icon="lock"
    severity="brand"
    [elevated]="true"
  >
    <div class="auth-form">
      <app-input
        formControlName="email"
        [label]="t.emailLabel"
        type="email"
        [placeholder]="t.emailPlaceholder"
        icon="mail"
      />

      <app-input
        formControlName="password"
        [label]="t.passwordLabel"
        type="password"
        [placeholder]="t.passwordPlaceholder"
        icon="key"
      />

      <app-input
        formControlName="confirmPassword"
        [label]="t.confirmPasswordLabel"
        type="password"
        [placeholder]="t.confirmPasswordPlaceholder"
        icon="key"
      />

      <app-button
        type="submit"
        [label]="t.confirmButton"
        severity="primary"
        icon="check"
        iconPos="right"
        [fullWidth]="true"
      />
    </div>
  </app-card>
</form>
