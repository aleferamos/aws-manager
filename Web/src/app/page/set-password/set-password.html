<form class="auth-page" (ngSubmit)="submit()" [formGroup]="form">
  <div class="auth-language">
    <app-drop-down
      formControlName="language"
      [options]="languageOptions"
      icon="language"
      [placeholder]="t.languagePlaceholder"
      size="md"
      [showDescription]="false"
    />
  </div>

  <app-card
    class="auth-card"
    [title]="t.title"
    [subtitle]="t.subtitle"
    icon="lock_reset"
    severity="brand"
    [elevated]="true"
  >
    @if (!inviteIsValid) {
      <div class="invite-warning">
        <span class="material-symbols-rounded" aria-hidden="true">
          warning
        </span>

        <div>
          <strong>{{ t.invalidInviteTitle }}</strong>
          <p>{{ t.invalidInviteDescription }}</p>
        </div>
      </div>
    }

    <div class="invite-summary">
      <div class="invite-summary-item">
        <span>{{ t.emailLabel }}</span>
        <strong>{{ form.controls.email.value || '-' }}</strong>
      </div>

      <div class="invite-summary-item">
        <span>{{ t.codeLabel }}</span>
        <strong>{{ form.controls.code.value || '-' }}</strong>
      </div>
    </div>

    <div class="auth-form">
      <app-input
        formControlName="password"
        [label]="t.passwordLabel"
        type="password"
        [placeholder]="t.passwordPlaceholder"
        icon="key"
      />

      <app-input
        formControlName="confirmPassword"
        [label]="t.confirmPasswordLabel"
        type="password"
        [placeholder]="t.confirmPasswordPlaceholder"
        icon="key"
      />

      <app-button
        type="submit"
        [label]="t.confirmButton"
        severity="primary"
        icon="check"
        iconPos="right"
        [fullWidth]="true"
        [loading]="loading"
      />
    </div>
  </app-card>
</form>
