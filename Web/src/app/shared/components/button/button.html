<button
  [type]="type"
  [class]="classes"
  [disabled]="disabled || loading"
  [attr.aria-label]="ariaLabel || label || icon"
  [attr.aria-busy]="loading"
  (click)="onClick($event)"
>
  @if (loading) {
    <span class="btn-spinner" aria-hidden="true"></span>
  } @else {
    @if (icon && iconPos === 'left') {
      <span class="material-symbols-rounded btn-ico" aria-hidden="true">
        {{ icon }}
      </span>
    }

    @if (label) {
      <span class="btn-label">{{ label }}</span>
    }

    @if (icon && iconPos === 'right') {
      <span class="material-symbols-rounded btn-ico" aria-hidden="true">
        {{ icon }}
      </span>
    }
  }
</button>
