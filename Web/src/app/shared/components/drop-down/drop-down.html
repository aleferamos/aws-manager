<div class="dropdown-field" [class.dropdown-field-full]="fullWidth">
  @if (label) {
    <label class="dropdown-label" [for]="id">
      {{ label }}
    </label>
  }

  <div [ngClass]="classes">
    <button
      [id]="id"
      type="button"
      class="dropdown-trigger"
      [disabled]="disabled"
      [attr.aria-label]="ariaLabel || label || placeholder"
      [attr.aria-expanded]="isOpen"
      [attr.aria-haspopup]="'listbox'"
      (click)="toggle()"
    >
      @if (icon) {
        <span class="material-symbols-rounded dropdown-leading-icon" aria-hidden="true">
          {{ icon }}
        </span>
      }

      <span class="dropdown-value">
        @if (selectedOption) {
          @if (selectedOption.flag) {
            <span class="dropdown-flag" aria-hidden="true">
              {{ selectedOption.flag }}
            </span>
          }

          @if (selectedOption.icon) {
            <span class="material-symbols-rounded dropdown-option-icon" aria-hidden="true">
              {{ selectedOption.icon }}
            </span>
          }

          <span class="dropdown-selected-text">
            {{ selectedOption.label }}
          </span>
        } @else {
          <span class="dropdown-placeholder">
            {{ placeholder }}
          </span>
        }
      </span>

      @if (clearable && hasValue && !disabled && !readonly) {
        <span
          class="material-symbols-rounded dropdown-clear"
          aria-hidden="true"
          (click)="clear($event)"
        >
          close
        </span>
      }

      <span class="material-symbols-rounded dropdown-chevron" aria-hidden="true">
        expand_more
      </span>
    </button>

    @if (isOpen) {
      <div
        class="dropdown-panel"
        role="listbox"
        [style.top.px]="panelTop"
        [style.left.px]="panelLeft"
        [style.width.px]="panelWidth"
        [style.--dropdown-panel-max-height.px]="resolvedPanelMaxHeight"
      >
        @if (searchable) {
          <div class="dropdown-search" (click)="handleSearchClick($event)">
            <span class="material-symbols-rounded dropdown-search-icon" aria-hidden="true">
              search
            </span>

            <input
              type="search"
              class="dropdown-search-input"
              [(ngModel)]="searchTerm"
              [ngModelOptions]="{ standalone: true }"
              [placeholder]="searchPlaceholder"
              autocomplete="off"
              spellcheck="false"
              (click)="handleSearchClick($event)"
            />

            @if (searchTerm) {
              <button
                type="button"
                class="dropdown-search-clear"
                [attr.aria-label]="t.clearSearch"
                (click)="searchTerm = ''; handleSearchClick($event)"
              >
                <span class="material-symbols-rounded" aria-hidden="true">close</span>
              </button>
            }
          </div>
        }

        <div class="dropdown-options">
          @for (option of filteredOptions; track option.value; let i = $index) {
            <button
              type="button"
              class="dropdown-option"
              [style.--option-index]="i"
              [class.dropdown-option-selected]="isSelected(option)"
              [class.dropdown-option-disabled]="option.disabled"
              [disabled]="option.disabled"
              role="option"
              [attr.aria-selected]="isSelected(option)"
              (click)="selectOption(option)"
            >
              <span class="dropdown-option-content">
                @if (option.flag) {
                  <span class="dropdown-flag" aria-hidden="true">
                    {{ option.flag }}
                  </span>
                }

                @if (option.icon) {
                  <span class="material-symbols-rounded dropdown-option-icon" aria-hidden="true">
                    {{ option.icon }}
                  </span>
                }

                <span class="dropdown-option-texts">
                  <span class="dropdown-option-label">
                    {{ option.label }}
                  </span>

                  @if (showDescription && option.description) {
                    <span class="dropdown-option-description">
                      {{ option.description }}
                    </span>
                  }
                </span>
              </span>

              @if (isSelected(option)) {
                <span class="material-symbols-rounded dropdown-check" aria-hidden="true">
                  check
                </span>
              }
            </button>
          } @empty {
            <div class="dropdown-empty">
              {{ emptySearchLabel }}
            </div>
          }
        </div>
      </div>
    }
  </div>

  @if (displayedError) {
    <small class="dropdown-error">
      {{ displayedError }}
    </small>
  } @else if (helperText) {
    <small class="dropdown-helper">
      {{ helperText }}
    </small>
  }
</div>
