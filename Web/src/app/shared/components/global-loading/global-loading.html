@if ((isLoading$ | async)! > 0) {
  <div class="global-loading-overlay" aria-live="polite" aria-busy="true">
    <div class="global-loading-card">
      <div class="global-loading-dots" aria-hidden="true">
        <span class="global-loading-dot"></span>
        <span class="global-loading-dot"></span>
        <span class="global-loading-dot"></span>
      </div>

      <span class="global-loading-text">
        Loading
      </span>
    </div>
  </div>
}
